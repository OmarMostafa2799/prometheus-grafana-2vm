---
- name: Install Grafana
  hosts: grafana

  tasks:
    - name: Copy install-grafana.sh to Grafana server
      copy:
        src: install-grafana.sh
        dest: /tmp/install-grafana.sh
        mode: '0755'



    - name: Execute install-grafana.sh with sudo
      become: true
      ansible.builtin.command:
        cmd: /bin/bash /tmp/install-grafana.sh



- name: Install Prometheus
  hosts: prometheus

  tasks:
    - name: Copy install-prometheus.sh to Prometheus server
      copy:
        src: install-prometheus.sh
        dest: /tmp/install-prometheus.sh
        mode: '0755'

    - name: Execute install-prometheus.sh with sudo
      become: true
      ansible.builtin.command:
        cmd: /bin/bash /tmp/install-prometheus.sh




- name: set hostname
  hosts: grafana

  tasks:
    - name: Copy hosts.sh to Grafana server
      copy:
        src: hosts.sh
        dest: /tmp/hosts.sh
        mode: '0755'

    - name: Execute install-grafana.sh with sudo
      become: true
      ansible.builtin.command:
        cmd: /bin/bash /tmp/hosts.sh
